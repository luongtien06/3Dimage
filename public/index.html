<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Turbo Gallery">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><text x='50' y='68' font-size='60' font-weight='bold' text-anchor='middle' fill='white' font-family='sans-serif'>T</text></svg>">
    <title>Turbo Gallery</title>
    <!-- Preload ảnh LCP candidate -->
    <link rel="preload" as="image" href="assets/i1/thumb.webp" fetchpriority="high">

    <style>
        :root {
            --bg-body: #0b0d12;
            --bg-card: #131620;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(129, 140, 248, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.15);
            --radius-card: 16px;
            --radius-pill: 999px;
            --transition-fast: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            --transition-smooth: 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            color-scheme: dark;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100dvh;
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px 40px;
        }

        /* Glow nền: position:absolute (không fixed) để không tạo layer composite riêng khi scroll. */
        body {
            position: relative;
        }
        body::before {
            content: "";
            position: absolute;
            top: -15vh;
            left: 50%;
            width: 80vw;
            max-width: 1000px;
            height: 40vh;
            background: radial-gradient(ellipse at top, rgba(99, 102, 241, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            transform: translateX(-50%);
            /* KHÔNG dùng translateZ(0): layer fixed trước đây gây composite nặng */
            will-change: auto;
        }

        /* Sticky Header — giữ backdrop-filter nhưng tối ưu layer */
        .site-header {
            position: sticky;
            top: 16px;
            z-index: 100;
            width: min(100%, 1080px);
            margin-top: 16px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(19, 22, 32, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-pill);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            /*
             * TỐI ƯU: translateZ(0) ở đây tạo layer composite riêng cho header
             * → backdrop-filter chỉ repaint layer này, không lan ra toàn trang.
             * Giữ nguyên vì có lợi cho backdrop-filter.
             */
            transform: translateZ(0);
            /* Giới hạn vùng ảnh hưởng của backdrop-filter */
            isolation: isolate;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), #4f46e5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.1rem;
            color: #fff;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .brand-title {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .header-badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: var(--radius-pill);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }

        .hero {
            position: relative;
            z-index: 1;
            width: min(100%, 1080px);
            padding: 44px 0 28px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .hero-tag {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            background: var(--accent-glow);
            padding: 4px 14px;
            border-radius: var(--radius-pill);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .hero h1 {
            font-size: clamp(2.2rem, 5vw, 3.2rem);
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -0.03em;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            max-width: 520px;
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .gallery-container {
            position: relative;
            z-index: 1;
            width: min(100%, 1080px);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px;
        }

        /** TỐI ƯU QUAN TRỌNG: */
         
        .card {
            position: relative;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            overflow: hidden;
            text-decoration: none;
            color: var(--text-main);
            outline: none;
            aspect-ratio: 1 / 1;
            contain: layout paint;
            transition: transform var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
        }

        .card-media {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.02);
        }

        .card-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform var(--transition-smooth);
            /* TỐI ƯU: khai báo aspect-ratio cho img để browser reserve space
               kể cả khi CSS parent thay đổi → chống CLS tuyệt đối */
            aspect-ratio: 1 / 1;
        }

        .card-media::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(0deg, rgba(11, 13, 18, 0.85) 0%, rgba(11, 13, 18, 0.2) 40%, transparent 100%);
            pointer-events: none;
            transition: opacity var(--transition-fast);
        }

        .card-overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }

        .card-badge {
            align-self: flex-end;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            /* Bỏ backdrop-filter: 21 badge = 21 lớp backdrop phải tính lại mỗi frame cuộn.
               Nền gần đặc nên tăng alpha 0.70 → 0.78 cho hiệu ứng thị giác tương đương. */
            background: rgba(11, 13, 18, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .card-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            transform: translateY(2px);
            transition: transform var(--transition-fast);
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .card-action {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent);
            opacity: 0.85;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: opacity var(--transition-fast), transform var(--transition-fast);
        }

        .card-action svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Hover & Focus — dùng transform/opacity (compositor-friendly) */
        .card:hover, .card:focus-visible {
            transform: translateY(-4px) translateZ(0);
            border-color: var(--border-hover);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45), 0 0 20px var(--accent-glow);
        }

        .card:hover .card-media img, .card:focus-visible .card-media img {
            transform: scale(1.06) translateZ(0);
        }

        .card:hover .card-media::after, .card:focus-visible .card-media::after {
            opacity: 0.7;
        }

        .card:hover .card-action, .card:focus-visible .card-action {
            opacity: 1;
            transform: translateX(2px);
        }

        /* Skeleton — giữ animation nhưng chỉ chạy opacity (compositor-friendly) */
        .card.skeleton .card-media {
            background: #181c2a;
            animation: skeletonPulse 1.2s ease-in-out infinite alternate;
        }

        @keyframes skeletonPulse {
            from { opacity: 0.45; }
            to { opacity: 0.9; }
        }

        .site-footer {
            margin-top: 60px;
            padding-top: 24px;
            width: min(100%, 1080px);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .footer-brand {
            font-weight: 600;
            color: var(--text-main);
        }

        @media (max-width: 1024px) {
            .gallery-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
        }

        @media (max-width: 680px) {
            body { padding: 0 14px 28px; }
            .site-header { top: 10px; padding: 10px 16px; }
            .hero { padding: 28px 0 20px; gap: 8px; }
            .hero p { font-size: 0.88rem; }
            .gallery-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
            .card-overlay { padding: 12px; }
            .card-title { font-size: 0.82rem; }
            .card-action span { display: none; }
            .site-footer { flex-direction: column; gap: 8px; text-align: center; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, ::before, ::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <a href="index.html" class="brand" aria-label="Trang chủ Turbo Gallery">
            <div class="brand-logo">T</div>
            <span class="brand-title">Turbo</span>
        </a>
        <div class="header-badge" id="headerBadge">29 Bộ sưu tập</div>
    </header>

    <section class="hero">
        <span class="hero-tag">Digital Exhibition</span>
        <h1>Khám Phá Không gian Ảnh</h1>
        <p>Bộ sưu tập ảnh 3D.</p>
    </section>

    <main class="gallery-container">
        <div class="gallery-grid" id="galleryGrid"></div>
    </main>

    <!-- Template giữ nguyên -->
    <template id="cardTemplate">
        <a class="card skeleton" href="" aria-label="">
            <div class="card-media">
                <img width="400" height="400" decoding="async" alt="" />
            </div>
            <div class="card-overlay">
                <span class="card-badge"></span>
                <div class="card-info">
                    <span class="card-title"></span>
                    <div class="card-action">
                        <span>Xem</span>
                        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </div>
                </div>
            </div>
        </a>
    </template>

    <footer class="site-footer">
        <div>© <span id="currentYear"></span> <span class="footer-brand">Turbo Gallery</span></div>
        <div>Minimalist Photography Exhibition</div>
    </footer>

    <script src="galleries.js"></script>
    <script>
        // DOM đã sẵn sàng, tránh một vòng event loop trễ.
        (function () {
            'use strict';

            var yearEl = document.getElementById('currentYear');
            if (yearEl) yearEl.textContent = new Date().getFullYear();
            var GALLERY_CONFIG = Array.isArray(window.TURBO_GALLERIES) ? window.TURBO_GALLERIES : [];

            var headerBadge = document.getElementById('headerBadge');
            if (headerBadge) headerBadge.textContent = GALLERY_CONFIG.length + ' Bộ sưu tập';

            var FALLBACK_SVG = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(
                '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">' +
                    '<rect width="100%" height="100%" fill="#131620"/>' +
                    '<rect x="2" y="2" width="396" height="396" rx="14" fill="none" stroke="#ffffff10" stroke-width="2"/>' +
                    '<text x="50%" y="48%" dominant-baseline="middle" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="15" font-weight="bold">TURBO GALLERY</text>' +
                    '<text x="50%" y="58%" dominant-baseline="middle" text-anchor="middle" fill="#6366f1" font-family="sans-serif" font-size="12">NO IMAGE</text>' +
                '</svg>'
            );

            var gridContainer = document.getElementById('galleryGrid');
            var template = document.getElementById('cardTemplate');
            if (!gridContainer || !template) return;

            function renderGrid(configList) {
                gridContainer.innerHTML = '';
                var fragment = document.createDocumentFragment();
                var total = configList.length;
                var EAGER_COUNT = 4;

                if (headerBadge) headerBadge.textContent = total + ' Bộ sưu tập';

                for (var i = 0; i < total; i++) {
                    var item = configList[i];
                    var folder = item.folder;
                    var count = item.count;
                    var thumb = item.thumb || ('assets/' + folder + '/thumb.webp');
                    if (item.version) thumb += '?v=' + encodeURIComponent(item.version);

                    var clone = template.content.cloneNode(true);
                    var card = clone.querySelector('.card');
                    var img = clone.querySelector('img');
                    var badge = clone.querySelector('.card-badge');
                    var title = clone.querySelector('.card-title');

                    card.href = 'gallery.html?folder=' + encodeURIComponent(folder);
                    card.setAttribute('aria-label', 'Xem bộ sưu tập ' + folder + ' với ' + count + ' ảnh');

                    badge.textContent = count + ' Ảnh';
                    title.textContent = '#' + (i + 1);

                    img.alt = 'Xem trước ' + folder;

                    if (i < EAGER_COUNT) {
                        img.loading = 'eager';
                        img.fetchPriority = (i === 0) ? 'high' : 'auto';
                    } else {
                        img.loading = 'lazy';
                        img.fetchPriority = 'low';
                    }

                    (function(c, im, fallbackSrc) {
                        var triedFallback = false;
                        im.addEventListener('load', function () {
                            c.classList.remove('skeleton');
                        }, { once: true });
                        im.addEventListener('error', function () {
                            if (!triedFallback && fallbackSrc) {
                                triedFallback = true;
                                im.src = fallbackSrc;
                            } else {
                                im.src = FALLBACK_SVG;
                                c.classList.remove('skeleton');
                            }
                        });
                        im.src = thumb;
                        if (im.complete && im.naturalWidth > 0) {
                            c.classList.remove('skeleton');
                        }
                    })(card, img, 'assets/' + folder + '/medium/1.webp' + (item.version ? '?v=' + encodeURIComponent(item.version) : ''));

                    fragment.appendChild(clone);
                }

                gridContainer.appendChild(fragment);
            }

            // Hiển thị ngay từ cấu hình nội bộ
            renderGrid(GALLERY_CONFIG);
        })();
    </script>
</body>
</html>
